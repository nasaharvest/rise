[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rise"
version = "0.1.0"
description = "RISE geospatial processing components"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
rdm = [
    "geopandas",
    "shapely",
    "pyproj",
    "pyogrio",
    "pyarrow",
    "pandas",
    "numpy",
    "xarray",
    "matplotlib",
    "openpyxl",
    "ipykernel",
    "ipywidgets",
    "osmnx",
    "rasterio",
    "rasterstats",
    "planetary-computer",
    "pystac-client",
    "s2cell",
]
satellite = [
    "rise-eo[local,azure,aml,mpc,grid] @ git+https://github.com/nikhilsrajan/fsd@v0.3.0",
    "scikit-learn",
    "joblib",
]

[project.scripts]
rise = "rise_cli:main"

[tool.setuptools]
packages = ["rdm", "rise_cli"]

[tool.setuptools.package-dir]
rdm = "rdm/src/rdm"
rise_cli = "src/rise_cli"
